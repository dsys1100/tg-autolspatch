name: Clean repo and Patch TG

on:
  workflow_dispatch: {} # Enables the manual start
  schedule:
    - cron: '0 23 * * *' # Start every day at 23:00 UTC
  push: # Autorun after commits
    branches:
      - main

permissions:
  contents: write # Give permission to put the release into the repo
  actions: write # Give permission to delete workflow runs

jobs:
  ClearReleasesTagsWorkflowlogs:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Delete all releases
        run: |
          gh release list --limit 1000 | awk '{print $1}' | while read tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all tags
        run: |
          git fetch --tags
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | while read tag; do
            echo "Deleting tag: $tag"
            git push origin --delete "$tag" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0

  PatchTelegram:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Re-Telegram Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "app-release.apk"
          repository: hxreborn/Re-Telegram-CherryFork
          latest: true

      - name: Rename Re-Telegram Module
        run: mv app-release.apk Re-Telegram.apk
        shell: bash

      - name: Download UserID Viewer Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "com.alex193a.tguseridviewer_v*_*.apk"
          repository: Xposed-Modules-Repo/com.alex193a.tguseridviewer
          latest: true

      - name: Rename UserID Viewer Module
        run: mv com.alex193a.tguseridviewer_v*_*.apk UserID.apk
        shell: bash

      - name: Download Nai Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "app-release.apk"
          repository: Xposed-Modules-Repo/com.amanoteam.nai
          latest: true

      - name: Rename Nai Module
        run: mv app-release.apk Nai.apk
        shell: bash

      - name: Download SpeedHook Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "Telegram.Speed.Hook-*.apk"
          repository: araafroyall/Telegram-Speed-Hook
          latest: true

      - name: Rename SpeedHook Module
        run: mv Telegram.Speed.Hook-*.apk SpeedHook.apk
        shell: bash

      - name: Create module list
        run: |
          MODULES=()
          for APK in *.apk; do
            [ -f "$APK" ] || continue
            [[ "$APK" == *-lsp.apk ]] && continue
            MODULES+=("$APK")
          done
          modules=""
          for APK in "${MODULES[@]}"; do
            modules+="-m $APK "
          done
          echo "$modules" > module_list.txt
        shell: bash

      - name: Download LSPatch Jar from Github
        uses: robinraju/release-downloader@v1
        with:
          fileName: "lspatch-*-release.jar"
          repository: JingMatrix/LSPatch
          latest: true

      - name: Download and Patch TelegramWeb Client
        run: |
          curl -fL --retry 2 --retry-delay 2 --retry-all-errors -o telegramWeb.apk https://telegram.org/dl/android/apk
          java -jar *.jar -l 2 telegramWeb.apk $(cat module_list.txt)
        shell: bash

      - name: Download and Patch TelegramBeta Client
        run: |
          curl -fL --retry 2 --retry-delay 2 --retry-all-errors -o telegramBeta.apk https://telegram.org/dl/android/apk-public-beta
          java -jar *.jar -l 2 telegramBeta.apk $(cat module_list.txt)
        shell: bash

      - name: Download Owpengram Client
        uses: robinraju/release-downloader@v1
        with:
          fileName: "OwpenGram.apk"
          repository: owpengram/owpengram-android-client
          latest: true

      - name: Rename and Patch Owpengram Client
        run: |
          mv OwpenGram.apk owpengram.apk
          java -jar *.jar -l 2 owpengram.apk $(cat module_list.txt)
        shell: bash

      - name: Rename Telegram Patched APKs
        run: |
          mv telegramWeb-*.apk telegramWeb-lsp.apk
          mv telegramBeta-*.apk telegramBeta-lsp.apk
          mv owpengram-*.apk owpengram-lsp.apk
        shell: bash

      - name: Create Release Info
        run: |
          curl -sSL https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -o build-tools.zip
          unzip -q build-tools.zip -d build-tools && rm build-tools.zip
          AAPT=build-tools/android-13/aapt
          chmod +x "$AAPT"
          echo "Used modules:" > release_body.txt
          read -r -a MODULE_ARGS < module_list.txt
          for ((i=0; i<${#MODULE_ARGS[@]}; i+=2)); do
            APK="${MODULE_ARGS[i+1]:-}"
            [ -n "$APK" ] || continue
            MODULE_NAME="${APK%.apk}"
            echo "- $MODULE_NAME" >> release_body.txt
          done
          echo "" >> release_body.txt
          echo "Clients:" >> release_body.txt
          export TELEGRAM="" TELEGRAM_BETA="" OTHER_CLIENTS=()
          for APK in *-lsp.apk; do
            [ -f "$APK" ] || continue
            INFO=$("$AAPT" dump badging "$APK")
            CLIENT_NAME=$(echo "$INFO" | sed -n "s/^application-label:'\(.*\)'/\1/p" | head -n 1)
            VERSION_NAME=$(echo "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
            VERSION_CODE=$(echo "$INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
            VERSION="$VERSION_NAME ($VERSION_CODE)"
            CLIENT_LINE="- $CLIENT_NAME - $VERSION"
            case "$CLIENT_NAME" in
              Telegram)
                TELEGRAM="$CLIENT_LINE"
                ;;
              "Telegram Beta")
                TELEGRAM_BETA="$CLIENT_LINE"
                ;;
              *)
                OTHER_CLIENTS+=("$CLIENT_LINE")
                ;;
            esac
            APK_NAME="${APK%-lsp.apk}"
            ENV_NAME=$(echo "${APK_NAME}_Version" | tr '[:lower:]' '[:upper:]')
            echo "${ENV_NAME}=$VERSION" >> "$GITHUB_ENV"
          done
          [ -n "$TELEGRAM" ] && echo "$TELEGRAM" >> release_body.txt
          [ -n "$TELEGRAM_BETA" ] && echo "$TELEGRAM_BETA" >> release_body.txt
          for CLIENT in "${OTHER_CLIENTS[@]}"; do
            echo "$CLIENT" >> release_body.txt
          done
          echo "" >> release_body.txt
          echo "Patched at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release_body.txt
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@master
        with:
          files: |
            *-lsp.apk
          tag_name: LSpatched
          draft: false
          body_path: release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
